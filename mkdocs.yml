site_name: go-activerecord
site_description: Генератор ORM для Go с поддержкой Octopus/Tarantool и PostgreSQL
site_url: https://educentr.github.io/go-activerecord/

repo_name: Educentr/go-activerecord
repo_url: https://github.com/Educentr/go-activerecord

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Светлая тема
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Главная: index.md
  - Начало работы:
    - getting-started/index.md
    - Установка: getting-started/installation.md
    - Быстрый старт: getting-started/quickstart.md
  - Архитектура:
    - architecture/index.md
    - Генерация кода: architecture/code-generation.md
    - Бэкенды: architecture/backends.md
    - Транзакции и автокоммит: architecture/transactions.md
  - Декларации:
    - declaration/index.md
    - Поля (Fields): declaration/fields.md
    - Индексы: declaration/indexes.md
    - Сериализаторы: declaration/serializers.md
    - Мутаторы и флаги: declaration/mutators.md
    - Триггеры: declaration/triggers.md
    - Связи и процедуры: declaration/relations.md
  - Использование:
    - usage/index.md
    - CRUD операции: usage/crud.md
    - Селекторы: usage/selectors.md
    - Атомарные операции: usage/atomic-ops.md
    - Конфигурация: usage/configuration.md
  - PostgreSQL:
    - postgresql/index.md
    - BulkUpdate: postgresql/bulk-update.md
    - BulkInsertReplace: postgresql/bulk-insert.md
    - Генератор схемы: postgresql/schema-generator.md
  - Octopus:
    - octopus/index.md
    - Работа с tuples: octopus/tuples.md
    - Хранимые процедуры: octopus/procedures.md
  - Тестирование:
    - testing/index.md
    - Фикстуры: testing/fixtures.md
  - Разработка:
    - development/index.md
    - Шаблоны: development/templates.md
  - Справочник:
    - reference/tags.md
    - reference/metrics.md
    - reference/cli.md
  - Решение проблем: troubleshooting.md
  - Roadmap: roadmap.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Educentr/go-activerecord
